name: Release

on:
  schedule:
    # Daily check for a newer qbittorrent-nox-static release. Cheap: the
    # build itself only runs if a new version is actually found.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace the release even if this version was already published"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      qbt_version: ${{ steps.version.outputs.qbt_version }}
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      # Full package version is <qbt_version>-<QPKG_REVISION>, matching
      # build.sh. Checking against the full version (not qbt_version alone)
      # means a packaging-only QPKG_REVISION bump gets released too, not
      # just a new upstream qBittorrent release.
      - name: Resolve full package version
        id: version
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/userdocs/qbittorrent-nox-static/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          qbt_version=$(printf '%s' "$tag" | sed -E 's/^release-([0-9.]+)_.*/\1/')
          if [ -z "$qbt_version" ]; then
            echo "Failed to resolve latest qbittorrent-nox-static version" >&2
            exit 1
          fi

          qpkg_revision=$(grep -oP 'QPKG_REVISION:-\K[0-9.]+' build.sh)
          if [ -z "$qpkg_revision" ]; then
            echo "Failed to resolve QPKG_REVISION default from build.sh" >&2
            exit 1
          fi

          echo "qbt_version=$qbt_version" >> "$GITHUB_OUTPUT"
          echo "version=${qbt_version}-${qpkg_revision}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "v${{ steps.version.outputs.version }} already released, forcing rebuild"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "v${{ steps.version.outputs.version }} already released, nothing to do"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "v${{ steps.version.outputs.version }} not yet released"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build QPKGs for all supported architectures
        run: ./build.sh

      - name: Remove existing release/tag before re-publishing
        if: github.event.inputs.force == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ needs.check-version.outputs.version }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          QBT_VERSION: ${{ needs.check-version.outputs.qbt_version }}
          REPO: ${{ github.repository }}
        run: |
          cat > release_notes.md <<EOF
          Automated build for qBittorrent ${QBT_VERSION}, packaging revision ${VERSION#*-}.

          Not sure which file matches your NAS? Check the [Architecture support table](https://github.com/${REPO}/blob/main/README.md#architecture-support) in README.md, or the full [model-by-model lookup](https://github.com/${REPO}/blob/main/QNAP-Models.md). Only \`x86_64\` is verified working on real hardware — the rest are packaged-but-untested.

          Uses static binaries from [userdocs/qbittorrent-nox-static](https://github.com/userdocs/qbittorrent-nox-static).

          These builds are unsigned (no GPG key is stored in this repo's CI). Sign locally with \`QPKG_GPG_KEY=... ./build.sh\` if you need a signed copy.
          EOF
          gh release create "v${VERSION}" build/*.qpkg \
            --repo "${REPO}" \
            --title "qBittorrent ${VERSION}" \
            --notes-file release_notes.md
